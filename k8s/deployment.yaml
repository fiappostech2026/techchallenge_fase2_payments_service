# PaymentsAPI (worker). A pipeline (.github/workflows/ci-cd.yml) troca
# "fcg-payments-api:latest" pela imagem versionada do ACR antes do kubectl apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: fcg-payments-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Credenciais e endereço do RabbitMQ/CloudAMQP vêm do Secret "payments-secret",
          # criado pela pipeline a partir dos Secrets do GitHub (nunca do Git).
          envFrom:
            - secretRef:
                name: payments-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
